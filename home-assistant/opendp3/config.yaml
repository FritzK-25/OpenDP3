name: OpenPowerstation Battery Telemetry
version: "0.3.1"
slug: opendp3
description: Local EcoFlow DELTA Pro 3 and Jackery Explorer 1000 v2 Bluetooth telemetry over MQTT
url: https://github.com/FritzK-25/OpenPowerstation
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
host_dbus: true
timeout: 60
backup: cold
map:
  - type: addon_config
    read_only: true
    path: /config
options:
  ecoflow_enabled: true
  # A fresh install has no Jackery serial yet, so leave that collector disabled
  # until the operator configures its 15-digit identity.
  jackery_enabled: false
  jackery_serial: ""
  ecoflow_adapter: "hci0"
  jackery_adapter: "hci0"
  # Control fails closed. Turn this on only to expose the guarded output and
  # battery-saving controls to Home Assistant.
  allow_control: false
schema:
  ecoflow_enabled: bool
  jackery_enabled: bool
  jackery_serial: str
  ecoflow_adapter: str
  jackery_adapter: str
  allow_control: bool
