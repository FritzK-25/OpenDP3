[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openpowerstation"
# Single-sourced from src/openpowerstation/__init__.py; see [tool.setuptools.dynamic].
dynamic = ["version"]
description = "Local Bluetooth telemetry, history and Home Assistant bridge for EcoFlow and Jackery power stations"
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "THIRD_PARTY_LICENSES/*"]
authors = [{ name = "OpenPowerstation contributors" }]
keywords = ["ecoflow", "jackery", "bluetooth", "ble", "home-assistant", "telemetry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Home Automation",
]
# Headless collectors, bridges and the CLI. This is what the production add-on
# installs, so anything added here ships to the Pi. Rendering and desktop
# packages belong in the extras below. home-assistant/opendp3/requirements-headless.in
# pins this set, plus what the app wrapper imports itself, for the image's hashed
# lock; tests/test_packaging_extras.py fails if a pin leaves these ranges.
dependencies = ["bleak>=1,<4", "ecdsa>=0.19,<0.20", "pycryptodome>=3.23,<4", "protobuf>=6.30,<8", "platformdirs>=4,<5", "portalocker>=3,<5", "httpx>=0.28,<1", "paho-mqtt>=2,<3"]

[project.optional-dependencies]
# Static chart rendering for evidence exports. `openpowerstation export` is a CLI
# command, not a desktop one, so this is separate from `gui`: a headless box can
# render evidence without installing Qt.
charts = ["matplotlib>=3.9,<4", "numpy>=2,<3"]
# packaging/prepare.py draws the Windows version resource. Pillow used to reach
# it by accident, as a transitive dependency of matplotlib; declared here so it
# no longer depends on that accident.
packaging = ["pillow>=10,<13"]
# The desktop application. It includes chart rendering because its exports page
# calls the same evidence export the CLI does.
gui = ["openpowerstation[charts]", "PySide6>=6.8,<7", "pyqtgraph>=0.13,<0.15"]
# Everything the suite needs except the desktop window. The export privacy
# assertions and the Windows-resource test are part of a plain `[test]` run;
# only the three Qt modules need more than this.
test = ["openpowerstation[charts,packaging]", "pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-xdist>=3.6,<4"]
test-gui = ["openpowerstation[gui]", "pytest-qt>=4,<5"]

[project.urls]
Homepage = "https://github.com/FritzK-25/OpenPowerstation"
Documentation = "https://github.com/FritzK-25/OpenPowerstation/blob/main/docs/REFERENCE.md"
Issues = "https://github.com/FritzK-25/OpenPowerstation/issues"
Changelog = "https://github.com/FritzK-25/OpenPowerstation/blob/main/home-assistant/opendp3/CHANGELOG.md"

[project.scripts]
openpowerstation = "openpowerstation.cli:main"
# The command's name before the rename; kept so existing scripts keep working.
opendp3 = "openpowerstation.cli:main"

[tool.setuptools.dynamic]
version = {attr = "openpowerstation.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
qt_api = "pyside6"
# A test stuck this long dumps every thread's traceback instead of hanging silently.
faulthandler_timeout = 120

[tool.ruff]
# Vendored upstream code is kept byte-identical to its pinned source, and the
# Home Assistant copy is generated by scripts/sync_ha_app.py.
extend-exclude = ["src/openpowerstation/vendor", "home-assistant/opendp3/src"]

[tool.ruff.lint]
# Pyflakes plus syntax errors: unused imports and variables, undefined names
# and the like. Formatting is left to the existing house style.
select = ["E9", "F"]
