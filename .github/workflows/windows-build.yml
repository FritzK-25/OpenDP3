name: Windows build

# The one definition of how the Windows executable is built. CI calls it on
# every push and pull request, and Release calls it on a tag, so a green CI
# run means the release build will succeed with the same pinned environment.
#
# It installs from requirements.lock (exact pins), not from the version ranges
# in pyproject.toml that the test matrix uses, then runs packaging/release.ps1:
# tests (unless run-tests is false), PyInstaller build, frozen verification.

on:
  workflow_call:
    inputs:
      run-tests:
        description: Run the test suite before building.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt
      - name: Install build environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.lock
          .\.venv\Scripts\python.exe -m pip install --no-deps -e .
          .\.venv\Scripts\python.exe -m pip install -r packaging/requirements-build.txt
      - name: Test, build and verify
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if ("${{ inputs.run-tests }}" -eq "true") { .\packaging\release.ps1 } else { .\packaging\release.ps1 -SkipTests }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-executable
          path: |
            OpenPowerstation-*.exe
            OpenPowerstation-*.exe.sha256
          if-no-files-found: error
