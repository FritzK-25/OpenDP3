name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Install
        run: python -m pip install -e ".[test,test-gui]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --durations=25
      - name: Protocol reference is current
        run: python scripts/generate_protocol_reference.py --check
      - name: Home Assistant app copy is current
        run: python scripts/sync_ha_app.py --check
