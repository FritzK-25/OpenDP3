name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Install
        run: python -m pip install -e ".[test,test-gui]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v --durations=25 -o faulthandler_timeout=240
      - name: Protocol reference is current
        run: python scripts/generate_protocol_reference.py --check
      - name: Home Assistant app copy is current
        run: python scripts/sync_ha_app.py --check

  # The release build, with the release's pinned environment. Runs here so a
  # broken build or a lockfile/pyproject mismatch shows up before tagging.
  windows-build:
    uses: ./.github/workflows/windows-build.yml

  home-assistant-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the app image
        run: |
          version=$(python3 packaging/project_version.py)
          docker build home-assistant/opendp3 --tag opendp3-app:ci \
            --build-arg BUILD_VERSION="$version" --build-arg BUILD_ARCH=amd64
      - name: Headless entry points import inside the image
        run: |
          docker run --rm opendp3-app:ci python -c "
          import json, opendp3, opendp3.cli, opendp3.bridge, opendp3.jackery_bridge, opendp3.recorder
          import run, linux_worker, bluetooth_status
          provenance = json.load(open('/opt/opendp3/SOURCE-PROVENANCE.json'))
          assert provenance['version'] == opendp3.__version__, provenance
          print('OpenDP3', opendp3.__version__, 'image OK')
          "
