name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request supersedes the old run. Every other
# run gets a group of its own, because a shared group would also drop queued
# runs: each commit on main keeps a result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Install
        run: python -m pip install -e ".[test,test-gui]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -n auto --durations=25
      - name: Protocol reference is current
        run: python scripts/generate_protocol_reference.py --check
      - name: Home Assistant app copy is current
        run: python scripts/sync_ha_app.py --check

  # Pyflakes-level checks (unused imports and variables, undefined names). The
  # rule set and exclusions live in pyproject.toml under [tool.ruff].
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          python -m pip install ruff==0.16.10
          ruff check --output-format=github .

  # This repository is public, so a commit's author and committer email is
  # published with it. Every new commit must use a GitHub no-reply address.
  # Scan tracked files directly; regression tests separately exercise the scanner.
  # On main the metadata check also catches merge commits
  # made in the GitHub web interface, which use the account's email setting.
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: New commits carry no personal email
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: python scripts/privacy_check.py --commits "$RANGE"
      - name: Tracked files pass publication checks
        run: python scripts/privacy_check.py

  # The release build, with the release's pinned environment. Runs here so a
  # broken build or a lockfile/pyproject mismatch shows up before tagging.
  # On pull requests it skips its own test pass: the test job above already
  # runs the suite on Windows. Pushes to main and release tags keep it, so the
  # pinned environment is still tested before anything ships.
  windows-build:
    uses: ./.github/workflows/windows-build.yml
    with:
      run-tests: ${{ github.event_name != 'pull_request' }}

  # Every architecture config.yaml ships. aarch64 (the Raspberry Pi) builds and
  # runs under QEMU emulation on the x86 runner, so an install that fails only
  # on arm64 shows up here rather than on a user's device.
  home-assistant-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            machine: x86_64
          - arch: aarch64
            platform: linux/arm64
            machine: aarch64
    name: home-assistant-image (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Emulate arm64
        if: matrix.arch != 'amd64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Build the app image
        run: |
          version=$(python3 packaging/project_version.py)
          docker build home-assistant/opendp3 --platform ${{ matrix.platform }} --tag opendp3-app:ci \
            --build-arg BUILD_VERSION="$version" --build-arg BUILD_ARCH=${{ matrix.arch }}
      - name: Headless entry points import inside the image
        run: |
          docker run --rm --platform ${{ matrix.platform }} -e EXPECTED_MACHINE=${{ matrix.machine }} \
            opendp3-app:ci python -c "
          import json, openpowerstation, openpowerstation.cli, openpowerstation.bridge, openpowerstation.jackery_bridge, openpowerstation.recorder
          import run, linux_worker, bluetooth_status
          provenance = json.load(open('/opt/opendp3/SOURCE-PROVENANCE.json'))
          assert provenance['version'] == openpowerstation.__version__, provenance
          import os, platform
          assert platform.machine() == os.environ['EXPECTED_MACHINE'], platform.machine()
          print('OpenPowerstation', openpowerstation.__version__, platform.machine(), 'image OK')
          "

  # One stable check name over the per-architecture builds, so branch
  # protection can require "home-assistant-app" however many architectures
  # the matrix grows. Fails unless every image build succeeded.
  home-assistant-app:
    needs: home-assistant-image
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every architecture built and imported
        env:
          RESULT: ${{ needs.home-assistant-image.result }}
        run: |
          echo "home-assistant-image: $RESULT"
          test "$RESULT" = success

  publication-gate:
    needs: [test, lint, privacy, windows-build, home-assistant-app]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All publication checks succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results and all(job['result'] == 'success' for job in results.values()), results
          PY
