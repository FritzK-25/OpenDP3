name: Release

# Builds the Windows executable from the tagged source, so the binary on the
# Releases page can be traced to a public build rather than a private machine.
# Push a tag such as v0.2.0 to run it. It creates a DRAFT release; review it,
# then publish.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Exact tagged commit was accepted on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python3 scripts/release_gate.py --commit "$GITHUB_SHA" --repository "$REPOSITORY"
      - name: Tag matches the package version
        run: |
          version=$(python3 packaging/project_version.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version."
            exit 1
          fi

  windows:
    needs: version
    uses: ./.github/workflows/windows-build.yml

  publish:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-executable
      - name: Hash matches the executable
        run: sha256sum --check OpenPowerstation-*.exe.sha256
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: OpenPowerstation-*.exe
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" OpenPowerstation-*.exe OpenPowerstation-*.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --draft --prerelease --title "OpenPowerstation $GITHUB_REF_NAME" \
            --notes "Public preview. Verify the download against the .sha256 file. See the README for known limits."
