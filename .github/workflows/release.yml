name: Release

# Builds the Windows executable from the tagged source, so the binary on the
# Releases page can be traced to a public build rather than a private machine.
# Push a tag such as v0.2.0 to run it. It creates a DRAFT release; review it,
# then publish.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.lock
          .\.venv\Scripts\python.exe -m pip install --no-deps -e .
          .\.venv\Scripts\python.exe -m pip install -r packaging/requirements-build.txt
          .\.venv\Scripts\python.exe -m pip install pytest pytest-asyncio pytest-qt
      - name: Tag matches the package version
        shell: pwsh
        run: |
          $version = (.\.venv\Scripts\python.exe packaging/project_version.py).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match package version $version." }
      - name: Test, build and verify
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\packaging\release.ps1
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: OpenDP3-*.exe
      - name: Draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" OpenDP3-*.exe OpenDP3-*.exe.sha256 `
            --draft --prerelease --title "OpenDP3 ${{ github.ref_name }}" `
            --notes "Public preview. Verify the download against the .sha256 file. See the README for known limits."
