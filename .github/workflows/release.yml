name: Release

# Builds the Windows executable from the tagged source, so the binary on the
# Releases page can be traced to a public build rather than a private machine.
# Push a tag such as v0.2.0 to run it. It creates a DRAFT release; review it,
# then publish.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the package version
        run: |
          version=$(python3 packaging/project_version.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version."
            exit 1
          fi

  windows:
    needs: version
    uses: ./.github/workflows/windows-build.yml

  publish:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-executable
      - name: Hash matches the executable
        run: sha256sum --check OpenDP3-*.exe.sha256
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: OpenDP3-*.exe
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" OpenDP3-*.exe OpenDP3-*.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --draft --prerelease --title "OpenDP3 $GITHUB_REF_NAME" \
            --notes "Public preview. Verify the download against the .sha256 file. See the README for known limits."
